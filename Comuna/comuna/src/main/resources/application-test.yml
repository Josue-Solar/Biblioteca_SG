spring:
  datasource:
    url: jdbc:h2:mem:comuna_db_test;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  
  sql:
    init:
      mode: never

eureka:
  client:
    enabled: false  # para no usar eureka, no se necesita en el test