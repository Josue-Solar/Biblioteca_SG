spring:
  # --- BASE DE DATOS H2 (Activa) ---
  datasource:
    url: jdbc:h2:mem:comuna_db
    driverClassName: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  
  h2:
    console:
      enabled: true
      path: /h2-console

# --- CONFIGURACIÓN DE LOGS ---
logging:
  file:
    name: comuna.log
  level:
    root: INFO
    com.biblioteca: DEBUG
    file: INFO
    com.biblioteca.file: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"

# --- SWAGGER Y DEBUG ---
debug: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true