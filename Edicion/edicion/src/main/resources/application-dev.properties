ejemplar.url=http://localhost:8084
editorial.url=http://localhost:8083

edicion.username=user
edicion.password=1234

spring.security.user.name=user
spring.security.user.password=1234

logging.level.root=INFO

logging.level.com.biblioteca=DEBUG

#formato del log, incluyendo timestamp, nivel de log, clase y mensaje
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

#Nombre del archivo de log
logging.file.name=persona.log

#Nivel de log para el archivo, en este caso se registra todo desde DEBUG en adelante
logging.level.file=INFO

#Nivel de log para el paquete de la aplicacion en el archivo, se puede configurar diferente al nivel de consola
logging.level.com.biblioteca.file=DEBUG

#Formato del log para el archivo, similar al de la consola pero con un formato diferente si se desea
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n


spring.main.allow-bean-definition-overriding=true


#para probar solo
# H2 Database
spring.datasource.url=jdbc:h2:mem:prestamo_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola H2 (opcional, para ver la BD)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#para swaggers
debug=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html
#springdoc.api-docs.path=/doc/v3/api-docs